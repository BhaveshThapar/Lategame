<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="RotomAI training pipeline and headline results"><title>RotomAI training pipeline and headline results</title><rect width="900" height="260" fill="#12141c"/><text x="24.0" y="34.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#e6e8ef" text-anchor="start" font-weight="bold">RotomAI training pipeline</text><text x="24.0" y="54.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7c8296" text-anchor="start" font-weight="normal">dashed = measured once and never scaled; no claim rests on it</text><rect x="24" y="82" width="186" height="92" rx="6" fill="none" stroke="#7c8296" stroke-width="1.5" stroke-dasharray="5 4"/><text x="117.0" y="108.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e6e8ef" text-anchor="middle" font-weight="bold">Human replays</text><text x="117.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7c8296" text-anchor="middle" font-weight="normal">2,760 rated gen9ou</text><text x="117.0" y="148.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7c8296" text-anchor="middle" font-weight="normal">119,996 turns</text><path d="M218 128.0 L250 128.0" stroke="#393f52" stroke-width="1.5"/><path d="M250 128.0 l-7 -4 v8 z" fill="#393f52"/><rect x="262" y="82" width="186" height="92" rx="6" fill="none" stroke="#7c8296" stroke-width="1.5" stroke-dasharray="5 4"/><text x="355.0" y="108.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e6e8ef" text-anchor="middle" font-weight="bold">Behaviour cloning</text><text x="355.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7c8296" text-anchor="middle" font-weight="normal">61.8k win