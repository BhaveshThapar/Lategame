<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Cross-run variance versus the seed-pooled read"><title>Cross-run variance versus the seed-pooled read</title><rect width="900" height="400" fill="#12141c"/><text x="24.0" y="34.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#e6e8ef" text-anchor="start" font-weight="bold">The same weights, measured twice</text><text x="24.0" y="54.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7c8296" text-anchor="start" font-weight="normal">Score rate vs poke-env SimpleHeuristicsPlayer, gen9ou, n=1,000 per checkpoint</text><text x="24.0" y="72.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7c8296" text-anchor="start" font-weight="normal">Every point is the SAME checkpoint file. Only the run differs.</text><path d="M90 320.0 H640" stroke="#393f52" stroke-width="0.6"/><text x="80.0" y="324.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#7c8296" text-anchor="end" font-weight="normal">0.64</text><path d="M90 282.7 H640" stroke="#393f52" stroke-width="0.6"/><text x="80.0" y="286.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#7c8296" text-anchor="end" font-weight="normal">0.67</text><path d="M90 245.3 H640" stroke="#393f52" stroke-width="0.6"/><text x="80.0" y="249.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#7c8296" text-anchor="end" font-weight="normal">0.69</text><path d="M90 208.0 H640" stroke="#393f52" stroke-width="0.6"/><text x="80.0" y="212.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#7c8296" text-anchor="end" font-weight="normal">0.72</text><path d="M90 170.7 H640" stroke="#393f52" stroke-width="0.6"/><text x="80.0" y="174.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#7c8296" text-anchor="end" font-weight="normal">0.75</text><path d="M90 133.3 H640" stroke="#393f52" stroke-width="0.6"/><text x="80.0" y="137.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#7c8296" text-anchor="end" font-weight="normal">0.77</text><path d="M90 96.0 H640" stroke="#393f52" stroke-width="0.6"/><text x="80.0" y="100.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#7c8296" text-anchor="end" font-weight="normal">0.80</text><text x="227.5" y="342.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7c8296" text-anchor="middle" font-weight="normal">seed 0</text><path d="M227.5 178.6 V150.6" stroke="#e8c860" stroke-width="1.5"/><circle cx="227.5" cy="178.6" r="5" fill="#12141c" stroke="#4ec9a0" stroke-width="2"/><circle cx="227.5" cy="150.6" r="5" fill="#12141c" stroke="#e8c860" stroke-width="2"/><text x="227.5" y="136.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e8c860" text-anchor="middle" font-weight="normal">+0.020</text><text x="365.0" y="342.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7c8296" text-anchor="middle" font-weight="normal">seed 1</text><path d="M365.0 268.2 V254.2" stroke="#e8c860" stroke-width="1.5"/><circle cx="365.0" cy="254.2" r="5" fill="#12141c" stroke="#4ec9a0" stroke-width="2"/><circle cx="365.0" cy="268.2" r="5" fill="#12141c" stroke="#e8c860" stroke-width="2"/><text x="365.0" y="240.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e8c860" text-anchor="middle" font-weight="normal">+0.010</text><text x="502.5" y="342.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7c8296" text-anchor="middle" font-weight="normal">seed 2</text><path d="M502.5 180.0 V152.0" stroke="#e8c860" stroke-width="1.5"/><circle cx="502.5" cy="152.0" r="5" fill="#12141c" stroke="#4ec9a0" stroke-width="2"/><circle cx="502.5" cy="180.0" r="5" fill="#12141c" stroke="#e8c860" stroke-width="2"/><text x="502.5" y="138.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e8c860" text-anchor="middle" font-weight="normal">+0.020</text><path d="M90 195.0 H640" stroke="#4ec9a0" stroke-width="1.2" stroke-dasharray="6 4"/><path d="M90 199.6 H640" stroke="#4ec9a0" stroke-width="1.2" stroke-dasharray="6 4"/><text x="654.0" y="199.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#4ec9a0" text-anchor="start" font-weight="normal">seed-pooled: 0.7260 / 0.7293</text><text x="654.0" y="217.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#4ec9a0" text-anchor="start" font-weight="normal">spread 0.0033</text><text x="24.0" y="380.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7c8296" text-anchor="start" font-weight="normal">Worst per-checkpoint spread is 6x the pooled spread.</text><text x="24.0" y="395.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7c8296" text-anchor="start" font-weight="normal">Standing rule: a cross-run difference under ~0.03 is not a result.</text><text x="24.0" y="410.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7c8296" text-anchor="start" font-weight="normal">Pooling over seeds is what buys run-to-run stability;</text><text x="24.0" y="425.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7c8296" text-anchor="start" font-weight="normal">raising n within one seed does not -- between-seed sd is</text><text x="24.0" y="440.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7c8296" text-anchor="start" font-weight="normal">~2.5x the within-seed binomial.</text><text x="24.0" y="455.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7c8296" text-anchor="start" font-weight="normal"></text><text x="24.0" y="470.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e05c5c" text-anchor="start" font-weight="normal">2 of the 3 runs survive as JSON. The third exists only</text><text x="24.0" y="485.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e05c5c" text-anchor="start" font-weight="normal">in its job log: two overlapping jobs shared one --out and the</text><text x="24.0" y="500.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e05c5c" text-anchor="start" font-weight="normal">later write won. (docs/RESULTS.md, Build 28)</text></svg>
