[build-system]
# >=77 for PEP 639: the SPDX `license = "MIT"` string below is a hard error under 68-76, and the
# older `license = {file = ...}` + `License ::` classifier form is deprecated from 77 on. There is
# no published wheel and nothing pins the floor, so taking the bump is free.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lategame"
version = "0.1.0"
description = "Competitive Pokemon Showdown ML battle agent (M0 infra + M1 baseline)"
readme = "README.md"
# 3.11 exactly is what is tested: ruff target-version, mypy python_version and environment.yml all
# say 3.11, and 3.10 has never been run once.
requires-python = ">=3.11,<3.13"
authors = [{ name = "Bhavesh Thapar" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
]
dependencies = [
    "poke-env>=0.8",
    "orjson>=3.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]
# torch is only needed for M2+ (BC policy training/inference). The feature
# encoder and self-play data collection run on numpy alone (a base dep), so the
# `collect` step does not require this extra -- only `train` and the `bc` agent do.
ml = [
    "torch>=2.2",
]

[project.urls]
Homepage = "https://github.com/BhaveshThapar/Lategame"
Repository = "https://github.com/BhaveshThapar/Lategame"

[project.scripts]
lategame = "lategame.cli:main"

[tool.setuptools.packages.find]
include = ["lategame*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
